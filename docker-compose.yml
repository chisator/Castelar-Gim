services:
  castelar-web:
    build:
      context: .
      # Solo las variables públicas, que Next necesita incrustar en el bundle
      # durante el build. Compose las resuelve desde el .env de esta carpeta.
      # Los secretos NO se pasan acá: llegan en runtime vía `env_file`.
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: castelar-web
    restart: always
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.castelar-web.entrypoints=websecure"
      - "traefik.http.routers.castelar-web.rule=Host(`clubcastelar.com`)"
      - "traefik.http.routers.castelar-web.tls.certresolver=mytlschallenge"
      - "traefik.http.services.castelar-web.loadbalancer.server.port=3000"
    # No declaramos 'networks' aquí: el servicio usará la red default del stack,
    # que abajo redefinimos para que sea 'root_default'.

networks:
  default:
    name: root_default
    external: true
